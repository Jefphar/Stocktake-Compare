name: Build Windows exe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - { run: npm install, working-directory: stocktake-app }
      - { run: npm run build, working-directory: stocktake-app }
      - uses: actions/upload-artifact@v4
        with: { name: Stocktake-Compare-exe, path: stocktake-app/dist/Stocktake-Compare.exe }
